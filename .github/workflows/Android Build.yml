name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Setup Android SDK and Accept Licenses
        # 使用此 Action 替代手动运行 `sdkmanager --licenses`
        # 它会自动安装必要的 SDK 组件并接受所有许可
        uses: android-actions/setup-android@v3

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Localization
        run: flutter gen-l10n

      - name: Read App Version
        id: version
        run: |
          raw_version=$(grep -E '^version:\s*(.+)$' pubspec.yaml | awk '{print $2}')
          version=$(echo $raw_version | cut -d'+' -f1)
          echo "app_version=$version" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$version" >> $GITHUB_ENV

      
      - name: Build Android APK (Debug)
        run: flutter build apk --debug

      - name: Prepare Artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/proxypin-mcp-android-${{ env.APP_VERSION }}-release.apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/proxypin-mcp-android-${{ env.APP_VERSION }}-debug.apk"

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/
          if-no-files-found: error

  publish-release:
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List Release Files
        run: ls -lh artifacts/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
